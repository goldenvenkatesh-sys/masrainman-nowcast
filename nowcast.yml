name: Automated Radar Nowcast

on:
  schedule:
    - cron: '*/15 * * * *'  # Runs automatically every 15 minutes
  workflow_dispatch:        # Allows you to trigger a run manually anytime

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install required Python libraries
        run: |
          python -m pip install --upgrade pip
          pip install requests opencv-python-headless matplotlib contextily numpy pillow

      - name: Run Multi-Radar Nowcast Engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python masrainman_telegram_engine.py
