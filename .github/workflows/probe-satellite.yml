name: probe-satellite (one-off, safe to delete)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe
        run: |
          mkdir -p probe && cd probe
          g() { curl -sS -m 40 -L -D "$1.h" -o "$1" "$2" || echo "FAIL $1" >> fails.txt; }
          B="https://view.eumetsat.int/geoserver/ows?service=WMS&version=1.1.1&srs=EPSG:4326&bbox=76,8,82,14&width=600&height=600&format=image/png&styles="
          for L in ir108 clm h63 rgb_microphysics wv062 cth; do g map_$L.png "$B&request=GetMap&layers=msg_iodc:$L"; done
          g leg_h63.png "https://view.eumetsat.int/geoserver/ows?service=WMS&version=1.1.1&request=GetLegendGraphic&layer=msg_iodc:h63&format=image/png&width=30&height=20"
          g leg_cth.png "https://view.eumetsat.int/geoserver/ows?service=WMS&version=1.1.1&request=GetLegendGraphic&layer=msg_iodc:cth&format=image/png&width=30&height=20"
          g sld_h63.xml "https://view.eumetsat.int/geoserver/ows?service=WMS&version=1.1.1&request=GetStyles&layers=msg_iodc:h63"
          ls -la
      - name: Save
        run: |
          cd probe
          git init -q && git checkout -q -b probe-satellite
          git config user.name masrainman-bot && git config user.email masrainman-bot@users.noreply.github.com
          git add -A && git commit -q -m "probe" && git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-satellite
