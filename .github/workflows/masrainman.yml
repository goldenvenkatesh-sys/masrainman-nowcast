name: MasRainman radar nowcast

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

concurrency:
  group: masrainman-cycle
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    env:
      BRAND_NAME: ${{ vars.BRAND_NAME || 'MasRainman' }}
      BRAND_HANDLE: ${{ vars.BRAND_HANDLE || '@masrainman' }}
      BRAND_URL: ${{ vars.BRAND_URL || '#' }}
      HASHTAGS: ${{ vars.HASHTAGS }}
      TELEGRAM_CHANNEL_MODE: ${{ vars.TELEGRAM_CHANNEL_MODE || 'new' }}
      ALERT_MIN_DBZ: ${{ vars.ALERT_MIN_DBZ || '30' }}
      REGIONS: ${{ vars.REGIONS || 'tn,kl,ka' }}
      VIEW_LAT_DEG: ${{ vars.VIEW_LAT_DEG || '1.1' }}
      MAX_VIEW_LAT_DEG: ${{ vars.MAX_VIEW_LAT_DEG || '1.4' }}
      MAX_CARDS_PER_REGION: ${{ vars.MAX_CARDS_PER_REGION || '4' }}
      CARD_BLOCK: ${{ vars.CARD_BLOCK || '2' }}
      CARD_THEME: ${{ vars.CARD_THEME || 'day' }}
      CARD_RAIN_STYLE: ${{ vars.CARD_RAIN_STYLE || 'smooth' }}
      BASEMAP_URL: ${{ vars.BASEMAP_URL }}
      APPROVALS_VIA_LISTENER: ${{ vars.APPROVALS_VIA_LISTENER || 'false' }}
      CARTO_API_KEY: ${{ secrets.CARTO_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
      TELEGRAM_FORWARD_CHAT_ID: ${{ secrets.TELEGRAM_FORWARD_CHAT_ID || vars.TELEGRAM_FORWARD_CHAT_ID || '@Masrainmanweather' }}
      TELEGRAM_FORWARD_EVERY_MIN: ${{ vars.TELEGRAM_FORWARD_EVERY_MIN || '30' }}
      TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
      TELEGRAM_ADMIN_IDS: ${{ secrets.TELEGRAM_ADMIN_IDS }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      WHAPI_TOKEN: ${{ secrets.WHAPI_TOKEN }}
      WHAPI_CHANNEL_ID: ${{ secrets.WHAPI_CHANNEL_ID }}
      WA_CHANNEL_EVERY_MIN: ${{ vars.WA_CHANNEL_EVERY_MIN || '60' }}
      # Radar cards/alerts -> South India Radar Nowcast Alerts; main channel gets promo teasers only
      WA_ALERT_CHANNEL_LINK: ${{ vars.WA_ALERT_CHANNEL_LINK || 'https://whatsapp.com/channel/0029VbE2C5F9RZAanCxEFv0o' }}
      WA_MAIN_CHANNEL_LINK: ${{ vars.WA_MAIN_CHANNEL_LINK || 'https://whatsapp.com/channel/0029VaBMeqH4Y9lg93fA8w3Y' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # The OCR / Tamil-shaping packages are cached between runs, so a broken
      # Ubuntu mirror can't stall the cycle. If they still can't be installed,
      # the bot carries on: OCR falls back to poll-receipt time, Tamil text
      # falls back to basic layout.
      - name: Work out apt cache key
        id: aptkey
        run: echo "key=apt-tess-v1-${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"

      - name: Restore cached OCR packages
        id: aptcache
        uses: actions/cache/restore@v4
        with:
          path: ~/aptdebs
          key: ${{ steps.aptkey.outputs.key }}

      - name: Install Tesseract OCR + Tamil text shaping libs
        id: aptinstall
        continue-on-error: true
        timeout-minutes: 3
        run: |
          PKGS="tesseract-ocr libraqm0 libfribidi0"
          APT_OPTS="-o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o APT::Keep-Downloaded-Packages=true"
          if ls ~/aptdebs/*.deb >/dev/null 2>&1; then
            echo "Installing $(ls ~/aptdebs/*.deb | wc -l) cached packages"
            if sudo dpkg -i ~/aptdebs/*.deb >/dev/null; then
              echo "cached=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
            echo "Cached install failed, trying the network"
          fi
          # Try with the image's package index first (no update), then refresh it.
          sudo timeout 60 apt-get install -y -qq $APT_OPTS $PKGS \
            || { sudo timeout 40 apt-get update -qq $APT_OPTS || true
                 sudo timeout 60 apt-get install -y -qq $APT_OPTS $PKGS; }
          mkdir -p ~/aptdebs
          if cp /var/cache/apt/archives/*.deb ~/aptdebs/ 2>/dev/null; then
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save OCR packages to cache
        if: ${{ steps.aptinstall.outcome == 'success' && steps.aptinstall.outputs.fresh == 'true' && steps.aptcache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/aptdebs
          key: ${{ steps.aptkey.outputs.key }}

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run one MasRainman cycle
        run: python run_cycle.py

      # ---- Hourly WhatsApp Channel post (free, Baileys linked device) ----
      # Runs only when the cycle queued cards (once an hour) and the WA_AUTH_B64 secret exists.
      # continue-on-error: a WhatsApp problem can never break the Telegram bot.
      - name: Check WhatsApp queue
        id: waq
        if: ${{ !cancelled() }}
        env:
          HAS_AUTH: ${{ secrets.WA_AUTH_B64 != '' }}
        run: |
          n=$(ls output/wa_queue/*.txt output/wa_promo_queue/*.txt 2>/dev/null | wc -l)
          # one-time branding of the alerts channel counts as work too
          if [ "$n" = "0" ] && [ ! -f state/wa_alert_brand_applied.txt ]; then n=1; fi
          echo "queued=$n" >> "$GITHUB_OUTPUT"
          echo "auth=$HAS_AUTH" >> "$GITHUB_OUTPUT"
          echo "WhatsApp queue: $n card(s), session secret present: $HAS_AUTH"

      - uses: actions/setup-node@v4
        if: ${{ !cancelled() && steps.waq.outputs.queued != '0' && steps.waq.outputs.auth == 'true' }}
        with:
          node-version: 20

      - name: Restore WhatsApp session
        id: wacache
        if: ${{ !cancelled() && steps.waq.outputs.queued != '0' && steps.waq.outputs.auth == 'true' }}
        uses: actions/cache/restore@v4
        with:
          path: wa_channel/wa_auth
          key: wa-auth-${{ github.run_id }}
          restore-keys: wa-auth-

      - name: Post to WhatsApp Channel
        id: wapost
        if: ${{ !cancelled() && steps.waq.outputs.queued != '0' && steps.waq.outputs.auth == 'true' }}
        continue-on-error: true
        working-directory: wa_channel
        env:
          WA_AUTH_B64: ${{ secrets.WA_AUTH_B64 }}
          WA_CHANNEL_ID: ${{ secrets.WA_CHANNEL_ID }}              # main MasRainman channel (promo only)
          WA_ALERT_CHANNEL_ID: ${{ secrets.WA_ALERT_CHANNEL_ID }}  # optional; else resolved from the link
          WA_ALERT_CHANNEL_LINK: ${{ vars.WA_ALERT_CHANNEL_LINK || 'https://whatsapp.com/channel/0029VbE2C5F9RZAanCxEFv0o' }}
        run: |
          if [ ! -f wa_auth/creds.json ]; then
            echo "$WA_AUTH_B64" | base64 -d > seed.zip && unzip -oq seed.zip -d . && rm seed.zip
          fi
          npm install --omit=dev --no-audit --no-fund --silent
          timeout 120 node post_channel.mjs post

      - name: Save WhatsApp session
        if: ${{ !cancelled() && steps.wacache.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: wa_channel/wa_auth
          key: wa-auth-${{ github.run_id }}

      - name: Upload this cycle's cards
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: masrainman-cards
          path: |
            output/masrainman_*.jpg
            output/caption_*.txt
          retention-days: 2
          if-no-files-found: ignore

      - name: Commit tracking state back to the repo
        if: ${{ !cancelled() }}
        run: |
          git config user.name  "masrainman-bot"
          git config user.email "masrainman-bot@users.noreply.github.com"
          # Publish this cycle's radar grid for the "Ask MasRainman" page (read via raw.githubusercontent.com)
          mkdir -p live
          rm -f live/nowcast_bot_grid.bin.gz
          [ -f output/nowcast_bot.json ] && cp output/nowcast_bot.json live/
          [ -f output/nowcast_bot_grid.bin.gz ] && cp output/nowcast_bot_grid.bin.gz live/
          for p in live state archive debug mosaic_frames radar_loop mosaic_basemap.png tiles_cache assets/masrainman_logo.png; do
            if [ -e "$p" ]; then git add -A "$p"; fi
          done
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -q -m "Update MasRainman radar state"
          for i in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep 5
          done
          echo "push failed after 3 tries (next run will retry)"
