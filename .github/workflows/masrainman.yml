name: MasRainman radar nowcast

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

concurrency:
  group: masrainman-cycle
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      BRAND_NAME: ${{ vars.BRAND_NAME || 'MasRainman' }}
      BRAND_HANDLE: ${{ vars.BRAND_HANDLE || '@masrainman' }}
      BRAND_URL: ${{ vars.BRAND_URL || '#' }}
      HASHTAGS: ${{ vars.HASHTAGS }}
      TELEGRAM_CHANNEL_MODE: ${{ vars.TELEGRAM_CHANNEL_MODE || 'new' }}
      ALERT_MIN_DBZ: ${{ vars.ALERT_MIN_DBZ || '30' }}
      REGIONS: ${{ vars.REGIONS || 'tn,kl,ka' }}
      VIEW_LAT_DEG: ${{ vars.VIEW_LAT_DEG || '1.6' }}
      CARD_BLOCK: ${{ vars.CARD_BLOCK || '2' }}
      BASEMAP_URL: ${{ vars.BASEMAP_URL }}
      APPROVALS_VIA_LISTENER: ${{ vars.APPROVALS_VIA_LISTENER || 'false' }}
      CARTO_API_KEY: ${{ secrets.CARTO_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
      TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
      TELEGRAM_ADMIN_IDS: ${{ secrets.TELEGRAM_ADMIN_IDS }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      WHAPI_TOKEN: ${{ secrets.WHAPI_TOKEN }}
      WHAPI_CHANNEL_ID: ${{ secrets.WHAPI_CHANNEL_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Tesseract OCR + Tamil text shaping libs
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr libraqm0 libfribidi0

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run one MasRainman cycle
        run: python run_cycle.py

      - name: Upload this cycle's cards
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: masrainman-cards
          path: |
            output/masrainman_*.jpg
            output/caption_*.txt
          retention-days: 2
          if-no-files-found: ignore

      - name: Commit tracking state back to the repo
        if: ${{ !cancelled() }}
        run: |
          git config user.name  "masrainman-bot"
          git config user.email "masrainman-bot@users.noreply.github.com"
          for p in state archive mosaic_frames radar_loop mosaic_basemap.png tiles_cache assets/masrainman_logo.png; do
            if [ -e "$p" ]; then git add -A "$p"; fi
          done
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -q -m "Update MasRainman radar state"
          for i in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep 5
          done
          echo "push failed after 3 tries (next run will retry)"
