name: Debug - fetch Hyderabad radar samples
on:
  push:
    branches: [debug-hyd]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: debug-hyd, sparse-checkout: .github }
      - run: |
          git sparse-checkout disable || true
          mkdir -p debug/hyd/loop
          t=$(date -u +%Y%m%dT%H%M%SZ)
          for p in caz ppz; do curl -fsS -A "Mozilla/5.0" -o debug/hyd/${p}_hyd_$t.gif "https://mausam.imd.gov.in/Radar/${p}_hyd.gif" || true; done
          B=https://mausam.imd.gov.in/hyderabad/mcdata
          curl -fsS -A "Mozilla/5.0" "$B/max24hrs.html" -o debug/hyd/max24hrs.html || true
          grep -oE '[A-Za-z0-9_./-]+\.(gif|png|jpg)' debug/hyd/max24hrs.html | sort -u | head -60 > debug/hyd/list.txt || true
          while read f; do n=$(basename "$f"); curl -fsS -A "Mozilla/5.0" -o "debug/hyd/loop/$n" "$B/$f" || rm -f "debug/hyd/loop/$n"; done < debug/hyd/list.txt
          ls -la debug/hyd debug/hyd/loop | head -80
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add debug/hyd && git commit -m "Hyderabad radar samples" && git push origin HEAD:debug-hyd
