name: Debug - fetch Hyderabad radar samples
on:
  push:
    branches: [debug-hyd]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: debug-hyd, sparse-checkout: .github }
      - run: |
          mkdir -p debug/hyd
          for i in 1 2 3; do
            t=$(date -u +%Y%m%dT%H%M%SZ)
            for p in caz ppz; do
              curl -fsS -A "Mozilla/5.0" -o debug/hyd/${p}_hyd_$t.gif "https://mausam.imd.gov.in/Radar/${p}_hyd.gif" || true
            done
            [ $i -lt 3 ] && sleep 330
          done
          ls -la debug/hyd
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add debug/hyd && git commit -m "Hyderabad radar samples" && git push origin HEAD:debug-hyd
