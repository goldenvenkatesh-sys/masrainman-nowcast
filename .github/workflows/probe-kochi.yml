name: probe-kochi (one-off, safe to delete)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Probe Kochi WMS + timing
        run: |
          mkdir -p probe && cd probe
          W=http://117.221.70.132/geoserver/dwr_kochi/wms
          curl -sS -m 40 -o caps.xml "$W?service=WMS&version=1.1.1&request=GetCapabilities" || true
          for i in 1 2 3; do
            curl -sS -m 30 -o ts_$i.txt http://117.221.70.132/timestamp.txt || true
            curl -sS -m 30 -D wms_$i.h -o wms_$i.png "$W?service=WMS&version=1.1.1&request=GetMap&layers=dwr_kochi:maxz_image&styles=&srs=EPSG:4326&bbox=73.0,7.7,79.6,12.3&width=1320&height=920&format=image/png&transparent=true" || true
            curl -sS -m 30 -D imd_$i.h -o imd_koc_$i.gif https://mausam.imd.gov.in/Radar/caz_koc.gif || true
            curl -sS -m 30 -D jpg_$i.h -o maxz_$i.jpg http://117.221.70.132/dwr/radwiz/images/maxz.jpg || true
            date -u +%T > t_$i.txt
            [ $i -lt 3 ] && sleep 240
          done
          ls -la
      - name: Save to branch probe-kochi
        run: |
          cd probe
          git init -q && git checkout -q -b probe-kochi
          git config user.name masrainman-bot && git config user.email masrainman-bot@users.noreply.github.com
          git add -A && git commit -q -m "Kochi probe $(date -u +%FT%TZ)"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-kochi
